#!/usr/bin/env bash
if [[ ${BASH_SOURCE[0]} == "$0" ]]; then
    exec "$(cd "$(dirname "$0")/.." && pwd)/run" "$0" "$@"
fi

RUN_CONFIG_VERSION=1
RUN_TARGET=bare-metal
RUN_DESCRIPTION='Build and verify the raw MYD-J7A100T microSD Linux boot image.'

RUN_JOBS=1
RUN_REBUILD=1
RUN_BUILD_TARGETS=(fpga-sd-image)
RUN_RUN_TARGETS=(verify-fpga-sd-image)
RUN_RECORD_VARIABLES=(
    FPGA_SD_IMAGE
    FPGA_SD_MANIFEST
    FPGA_SD_DTS
    FPGA_SD_OPENSBI
    FPGA_SD_LINUX
)
RUN_SOURCE_VARIABLES=(OPENRV64_MAKEFILES)
RUN_SOURCE_PATHS=(
    tools/make-fpga-sd-image.py
    doc/fpga/sd-boot-image.md
    sw/opensbi.dts
    build/opensbi-fpga-linux/artifacts/fw_jump.bin
    sw/Image.Zicclsm
)
RUN_ARTIFACT_VARIABLES=(FPGA_SD_IMAGE FPGA_SD_MANIFEST)
RUN_PASS_REGEX='^OPENRV64 FPGA SD IMAGE PASS$'
RUN_RESULT_REGEX='^FPGA_SD_IMAGE_RESULT '
